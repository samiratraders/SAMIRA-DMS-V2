  /* ========== UTILS ========== */
  function taka(n){return"৳"+(Number(n)||0).toLocaleString("en-BD",{maximumFractionDigits:0});}
  function todayISO(){return new Date().toISOString().slice(0,10);}
  function nextId(list,prefix){
    var nums=list.map(function(x){return x.id||x.sku}).filter(function(id){return id&&id.startsWith(prefix+"-")}).map(function(id){return parseInt(id.split("-")[1],10)}).filter(function(n){return!isNaN(n)});
    var nxt=(nums.length?Math.max.apply(null,nums):0)+1;
    return prefix+"-"+String(nxt).padStart(4,"0");
  }

  function saveData(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
  function log(d,user,action,role){d.activityLog.unshift({time:new Date().toLocaleString("en-GB"),user:user,action:action,role:role||"-"});if(d.activityLog.length>200)d.activityLog.length=200;saveData(d);}

  /* ========== LEDGER / CALCULATION ENGINE ========== */
  var L={
    /* Stock: Opening + Purchases + ReturnFresh − OutDSR − OutSale */
    stock:function(d,sku){
      var p=d.products.find(function(x){return x.sku===sku});if(!p)return 0;
      var pur=d.purchases.filter(function(x){return x.sku===sku}).reduce(function(s,x){return s+x.qty},0);
      var out=d.stockMovements.filter(function(m){return m.sku===sku&&(m.type==="out-dsr"||m.type==="out-sale")}).reduce(function(s,m){return s+m.qty},0);
      var retFresh=d.stockMovements.filter(function(m){return m.sku===sku&&m.type==="return-fresh"}).reduce(function(s,m){return s+m.qty},0);
      return p.opening+pur-out+retFresh;
    },
    damageStock:function(d,sku){
      return d.stockMovements.filter(function(m){return m.sku===sku&&m.type==="return-damage"}).reduce(function(s,m){return s+m.qty},0);
    },
    stockValue:function(d,sku){var p=d.products.find(function(x){return x.sku===sku});return p?L.stock(d,sku)*p.cost:0;},
    damageValue:function(d,sku){var p=d.products.find(function(x){return x.sku===sku});return p?L.damageStock(d,sku)*p.cost:0;},
    totalInventoryValue:function(d){return d.products.reduce(function(s,p){return s+L.stockValue(d,p.sku)+L.damageValue(d,p.sku)},0);},
    customerDue:function(d,cid){
      var c=d.customers.find(function(x){return x.id===cid});if(!c)return 0;
      var sales=d.orders.filter(function(o){return o.customerId===cid&&(o.status==="Approved"||o.status==="Delivered")}).reduce(function(s,o){return s+o.qty*o.price-(o.discount||0)},0);
      var col=d.collections.filter(function(x){return x.customerId===cid}).reduce(function(s,x){return s+x.amount},0);
      return c.opening+sales-col;
    },
    subdbDue:function(d,did){
      var s=d.subdb.find(function(x){return x.id===did});if(!s)return 0;
      return s.opening;
    },
    totalReceivable:function(d){
      var cust=d.customers.reduce(function(s,c){return s+Math.max(0,L.customerDue(d,c.id))},0);
      var sub=d.subdb.reduce(function(s,x){return s+Math.max(0,L.subdbDue(d,x.id))},0);
      return cust+sub;
    },
    supplierDue:function(d,sid){
      var s=d.suppliers.find(function(x){return x.id===sid});if(!s)return 0;
      var pur=d.purchases.filter(function(p){return p.supplierId===sid}).reduce(function(sm,p){return sm+p.qty*p.cost},0);
      return s.opening+pur;
    },
    totalPayable:function(d){return d.suppliers.reduce(function(s,sup){return s+Math.max(0,L.supplierDue(d,sup.id))},0);},
    totalFreeDiscountValue:function(d){return d.dailyFreeDiscount.reduce(function(s,x){return s+x.freeValue+x.discountValue},0);},
    /* DSR Settlement Formula */
    dsrSettlement:function(stockOut,retFresh,retDamage,freeVal,disc,exp,due){
      return stockOut-(retFresh+retDamage+freeVal+disc+due+exp);
    },
    /* Investment Formula as per specification:
       Inventory (fresh+damage) + Due from (SubDB+Cust+Mgr+DSR+SR) + Free/Disc panel +
       Pending bills + Security deposit + Transport + Office/Godown advance - Payable to suppliers */
    investment:function(d){
      var inv=L.totalInventoryValue(d);
      var rec=L.totalReceivable(d);
      var frd=L.totalFreeDiscountValue(d);
      var pb=d.assets.pendingBills||0;
      var sec=d.assets.securityDeposit||0;
      var tr=d.assets.transportAssets||0;
      var adv=(d.assets.officeAdvance||0)+(d.assets.godownAdvance||0);
      var pay=L.totalPayable(d);
      return{
        inventory:inv,receivable:rec,freeDiscount:frd,pendingBills:pb,
        security:sec,transport:tr,advance:adv,payable:pay,
        total:inv+rec+frd+pb+sec+tr+adv-pay
      };
    }
  };

        fld("Opening Stock",'<input id="f_open" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+ftr("Save Product");break;
      case"supplier":title="Add New Supplier";body=hdr(title)+fld("Supplier Name",'<input id="f_name" class="'+ic()+'" style="'+is_()+'"/>')+fld("Contact Person",'<input id="f_contact" class="'+ic()+'" style="'+is_()+'"/>')+fld("Phone",'<input id="f_phone" class="'+ic()+'" style="'+is_()+'"/>')+fld("Opening Payable Balance",'<input id="f_open" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+ftr("Save Supplier");break;
      case"subdb":title="Add New Sub DB";body=hdr(title)+fld("Business Name",'<input id="f_name" class="'+ic()+'" style="'+is_()+'"/>')+fld("Area",'<input id="f_area" class="'+ic()+'" style="'+is_()+'"/>')+fld("Phone",'<input id="f_phone" class="'+ic()+'" style="'+is_()+'"/>')+fld("Opening Receivable",'<input id="f_open" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+ftr("Save Sub DB");break;
      case"customer":title="Add New Customer";body=hdr(title)+fld("Shop Name",'<input id="f_shop" class="'+ic()+'" style="'+is_()+'"/>')+fld("Owner Name",'<input id="f_name" class="'+ic()+'" style="'+is_()+'"/>')+fld("Area",'<input id="f_area" class="'+ic()+'" style="'+is_()+'"/>')+fld("Phone",'<input id="f_phone" class="'+ic()+'" style="'+is_()+'"/>')+fld("Credit Limit (৳)",'<input id="f_limit" type="number" class="'+ic()+'" style="'+is_()+'" value="30000"/>')+fld("Opening Due",'<input id="f_open" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+ftr("Save Customer");break;
      case"order":title="New Order Entry";body=hdr(title)+
        fld("Customer",'<select id="f_cust" class="'+ic()+'" style="'+is_()+'">'+d.customers.map(function(c){return'<option value="'+c.id+'">'+c.shop+'</option>'}).join("")+'</select>')+
        fld("Product",'<select id="f_sku" class="'+ic()+'" style="'+is_()+'">'+d.products.map(function(p){return'<option value="'+p.sku+'">'+p.name+' — '+taka(p.price)+'</option>'}).join("")+'</select>')+
        '<div id="stockInfo" class="text-[11px] mb-3 -mt-2" style="color:'+C.inkSoft+'"></div>'+
        '<div class="grid grid-cols-2 gap-3">'+fld("Quantity",'<input id="f_qty" type="number" class="'+ic()+'" style="'+is_()+'" value="1"/>')+fld("Free Qty",'<input id="f_free" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+'</div>'+
        fld("Discount (৳)",'<input id="f_disc" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+
        fld("Status",'<select id="f_status" class="'+ic()+'" style="'+is_()+'"><option>Pending</option><option>Approved</option><option>Delivered</option></select>')+
        '<div class="rounded-lg px-4 py-3 mb-3 flex justify-between items-center" style="background:'+C.paperDark+'"><span class="text-xs" style="color:'+C.inkSoft+'">Order Total</span><span id="ordTotal" class="tabular text-lg font-bold" style="color:'+C.green+'">৳0</span></div>'+ftr("Save Order");break;
      case"dsr":title="DSR Daily Settlement";body=hdr(title)+
        fld("DSR Name",'<input id="f_dsr" class="'+ic()+'" style="'+is_()+'" value="'+state.user.name+'"/>')+
        '<div class="grid grid-cols-2 gap-3">'+fld("Stock Out Value",'<input id="f_so" type="number" class="'+ic()+'" style="'+is_()+'"/>')+fld("Return Fresh",'<input id="f_rf" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+'</div>'+
        '<div class="grid grid-cols-2 gap-3">'+fld("Return Damage",'<input id="f_rd" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+fld("Free Products Value",'<input id="f_fr" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+'</div>'+
        '<div class="grid grid-cols-2 gap-3">'+fld("Discount",'<input id="f_dc" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+fld("Expenses",'<input id="f_ex" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+'</div>'+
        fld("Customer Due",'<input id="f_cd" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+
        '<div class="rounded-lg px-4 py-3 mb-3 flex justify-between items-center" style="background:'+C.paperDark+'"><span class="text-xs" style="color:'+C.inkSoft+'">Net Payable by DSR</span><span id="dsrNet" class="tabular text-lg font-bold" style="color:'+C.green+'">৳0</span></div>'+ftr("Save Settlement");break;
      case"collection":title="New Collection Entry";body=hdr(title)+
        fld("Customer",'<select id="f_cust" class="'+ic()+'" style="'+is_()+'">'+d.customers.map(function(c){return'<option value="'+c.id+'">'+c.shop+'</option>'}).join("")+'</select>')+
        '<div id="custDue" class="text-[11px] mb-3 -mt-2" style="color:'+C.inkSoft+'"></div>'+
        fld("Amount (৳)",'<input id="f_amt" type="number" class="'+ic()+'" style="'+is_()+'"/>')+
        fld("Method",'<select id="f_method" class="'+ic()+'" style="'+is_()+'"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Bank</option><option>Cheque</option></select>')+ftr("Save Collection");break;
      case"claim":title="New Supplier Claim";body=hdr(title)+
        fld("Supplier",'<select id="f_sup" class="'+ic()+'" style="'+is_()+'">'+d.suppliers.map(function(s){return'<option value="'+s.id+'">'+s.name+'</option>'}).join("")+'</select>')+
        fld("Product",'<select id="f_sku" class="'+ic()+'" style="'+is_()+'">'+d.products.map(function(p){return'<option value="'+p.sku+'">'+p.name+'</option>'}).join("")+'</select>')+
        '<div class="grid grid-cols-2 gap-3">'+fld("Free Qty",'<input id="f_free" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+fld("Discount (৳)",'<input id="f_disc" type="number" class="'+ic()+'" style="'+is_()+'" value="0"/>')+'</div>'+
        '<div class="rounded-lg px-4 py-3 mb-3 flex justify-between items-center" style="background:'+C.paperDark+'"><span class="text-xs" style="color:'+C.inkSoft+'">Claim Value</span><span id="claimVal" class="tabular text-lg font-bold" style="color:'+C.brick+'">৳0</span></div>'+ftr("Submit Claim");break;
      case"assets":title="Update Asset Values";body=hdr(title)+
        fld("Security Deposit (৳)",'<input id="f_sec" type="number" class="'+ic()+'" style="'+is_()+'" value="'+(d.assets.securityDeposit||0)+'"/>')+
        fld("Transport & Fixed Assets (৳)",'<input id="f_tr" type="number" class="'+ic()+'" style="'+is_()+'" value="'+(d.assets.transportAssets||0)+'"/>')+
        fld("Office Advance (৳)",'<input id="f_off" type="number" class="'+ic()+'" style="'+is_()+'" value="'+(d.assets.officeAdvance||0)+'"/>')+
        fld("Godown Advance (৳)",'<input id="f_gd" type="number" class="'+ic()+'" style="'+is_()+'" value="'+(d.assets.godownAdvance||0)+'"/>')+
        fld("Pending / Unapproved Bills (৳)",'<input id="f_pb" type="number" class="'+ic()+'" style="'+is_()+'" value="'+(d.assets.pendingBills||0)+'"/>')+ftr("Save Asset Values");break;
    }
    return body;
  }
  window.__closeModal=function(){state.modal=null;state.modalData={};render();};
  window.__openModal=function(m){state.modal=m;state.modalData={};render();};

  function bindModal(){
    if(!state.modal)return;
    var d=state.data;
    function g(id){var e=document.getElementById(id);return e?e.value:"";}
    function gn(id){return Number(g(id))||0;}

    if(state.modal==="order"){
      var sku=document.getElementById("f_sku"),qty=document.getElementById("f_qty"),disc=document.getElementById("f_disc"),tot=document.getElementById("ordTotal"),si=document.getElementById("stockInfo");
      function upd(){var p=d.products.find(function(x){return x.sku===sku.value});var s=L.stock(d,p.sku);si.textContent="Available stock: "+s+" "+p.unit;si.style.color=s<5?C.brick:C.inkSoft;var q=Number(qty.value)||0,dc=Number(disc.value)||0;tot.textContent=taka(Math.max(0,q*p.price-dc));}
      sku.onchange=upd;qty.oninput=upd;disc.oninput=upd;upd();
    }
    if(state.modal==="dsr"){
      ["f_so","f_rf","f_rd","f_fr","f_dc","f_ex","f_cd"].forEach(function(id){var el=document.getElementById(id);if(el)el.oninput=updDSR;});
      function updDSR(){var n=L.dsrSettlement(gn("f_so"),gn("f_rf"),gn("f_rd"),gn("f_fr"),gn("f_dc"),gn("f_ex"),gn("f_cd"));var el=document.getElementById("dsrNet");if(el){el.textContent=taka(n);el.style.color=n<0?C.brick:C.green;}}
      updDSR();
    }
    if(state.modal==="collection"){
      var cust=document.getElementById("f_cust"),due=document.getElementById("custDue");
      function upd(){var c=d.customers.find(function(x){return x.id===cust.value});due.textContent="Current due: "+taka(L.customerDue(d,c.id));}
      cust.onchange=upd;upd();
    }
    if(state.modal==="claim"){
      var sku=document.getElementById("f_sku"),fr=document.getElementById("f_free"),dc=document.getElementById("f_disc"),cv=document.getElementById("claimVal");
      function upd(){var p=d.products.find(function(x){return x.sku===sku.value});var f=Number(fr.value)||0,dd=Number(dc.value)||0;cv.textContent=taka(f*(p?p.cost:0)+dd);}
      sku.onchange=upd;fr.oninput=upd;dc.oninput=upd;upd();
    }
    /* Search */
    onQ("searchInv",function(q){document.getElementById("invBody").innerHTML=renderInvRows(d.products.filter(function(p){return(p.name+p.brand+p.cat).toLowerCase().includes(q.toLowerCase())}));});
    onQ("searchSup",function(q){document.getElementById("supList").innerHTML=renderSupRows(d.suppliers.filter(function(s){return s.name.toLowerCase().includes(q.toLowerCase())}));});
    onQ("searchCust",function(q){document.getElementById("custList").innerHTML=renderCustRows(d.customers.filter(function(c){return(c.shop+c.name).toLowerCase().includes(q.toLowerCase())}));});
    onQ("searchOrd",function(q){var ql=q.toLowerCase();document.getElementById("ordBody").innerHTML=renderOrdRows(d.orders.slice().reverse().filter(function(o){var c=d.customers.find(function(x){return x.id===o.customerId});return o.id.toLowerCase().includes(ql)||(c&&c.shop.toLowerCase().includes(ql));}));});
    /* Status cycle */
    document.querySelectorAll(".status-btn").forEach(function(b){b.onclick=function(){var id=b.dataset.ord;var o=d.orders.find(function(x){return x.id===id});if(!o)return;var flow={Pending:"Approved",Approved:"Delivered",Delivered:"Pending"};o.status=flow[o.status];log(d,state.user.name,"Order "+o.id+" → "+o.status,state.user.roleLabel);render();};});
    document.querySelectorAll(".claim-btn").forEach(function(b){b.onclick=function(){var id=b.dataset.claim;var c=d.claims.find(function(x){return x.id===id});if(!c)return;var flow={Pending:"Approved",Approved:"Rejected",Rejected:"Pending"};c.status=flow[c.status];log(d,state.user.name,"Claim "+c.id+" → "+c.status,state.user.roleLabel);render();};});
    /* Import */
    var imp=document.getElementById("importFile");if(imp)imp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var data=JSON.parse(ev.target.result);state.data=data;saveData(data);alert("Backup restored successfully!");render();}catch(err){alert("Invalid backup file!");}};r.readAsText(f);};
  }
  function onQ(id,fn){var el=document.getElementById(id);if(!el)return;el.oninput=function(){fn(el.value);};}

  /* ========== SUBMIT ========== */
  window.__submit=function(){
    var d=state.data;
    function g(id){var e=document.getElementById(id);return e?e.value:"";}
    function gn(id){return Number(g(id))||0;}
    try{
      switch(state.modal){
        case"product":
          if(!g("f_name").trim()||!gn("f_price"))return alert("Please fill product name and price");
          d.products.push({sku:nextId(d.products.map(function(p){return{id:p.sku}}),"P"),name:g("f_name").trim(),cat:g("f_cat").trim(),brand:g("f_brand").trim(),supplierId:g("f_sup"),unit:g("f_unit")||"pcs",cost:gn("f_cost"),price:gn("f_price"),opening:gn("f_open")});
          log(d,state.user.name,"Added product: "+g("f_name").trim(),state.user.roleLabel);break;
        case"supplier":
          if(!g("f_name").trim())return alert("Please fill supplier name");
          d.suppliers.push({id:nextId(d.suppliers,"S"),name:g("f_name").trim(),contact:g("f_contact").trim(),phone:g("f_phone").trim(),opening:gn("f_open")});
          log(d,state.user.name,"Added supplier: "+g("f_name").trim(),state.user.roleLabel);break;
        case"subdb":
          if(!g("f_name").trim())return alert("Please fill business name");
          d.subdb.push({id:nextId(d.subdb,"DB"),name:g("f_name").trim(),area:g("f_area").trim(),phone:g("f_phone").trim(),opening:gn("f_open")});
          log(d,state.user.name,"Added Sub DB: "+g("f_name").trim(),state.user.roleLabel);break;
        case"customer":
          if(!g("f_shop").trim())return alert("Please fill shop name");
          d.customers.push({id:nextId(d.customers,"C"),name:g("f_name").trim(),shop:g("f_shop").trim(),area:g("f_area").trim(),phone:g("f_phone").trim(),creditLimit:gn("f_limit"),opening:gn("f_open")});
          log(d,state.user.name,"Added customer: "+g("f_shop").trim(),state.user.roleLabel);break;
        case"order":
          var p=d.products.find(function(x){return x.sku===g("f_sku")});var q=gn("f_qty");if(!p||q<=0)return alert("Invalid product or quantity");
          var cust=d.customers.find(function(c){return c.id===g("f_cust")});
          d.orders.push({id:nextId(d.orders,"ORD"),date:todayISO(),customerId:g("f_cust"),sku:p.sku,supplierId:p.supplierId,qty:q,freeQty:gn("f_free"),price:p.price,discount:gn("f_disc"),status:g("f_status"),srId:state.user.role==="sr"?state.user.name:"SR-001",dsrId:"DSR-001"});
          log(d,state.user.name,"Created order "+nextId(d.orders,"ORD").replace(/\d+$/,function(m){return String(parseInt(m)-1).padStart(4,"0")}),state.user.roleLabel);break;
        case"dsr":
          if(!g("f_dsr").trim()||!gn("f_so"))return alert("Please fill DSR name and stock out value");
          var so=gn("f_so"),rf=gn("f_rf"),rd=gn("f_rd"),fv=gn("f_fr"),dc=gn("f_dc"),ex=gn("f_ex"),cd=gn("f_cd");
          var np=L.dsrSettlement(so,rf,rd,fv,dc,ex,cd);
          var sid="DSR-"+todayISO().replace(/-/g,"");
          d.dsrSettlements.push({id:sid,date:todayISO(),dsrId:"DSR-001",dsrName:g("f_dsr").trim(),stockOutValue:so,returnsFresh:rf,returnsDamage:rd,freeValue:fv,discount:dc,expenses:ex,customerDue:cd,netPayable:np,status:"Settled"});
          log(d,state.user.name,"DSR Settlement: "+g("f_dsr").trim()+" → "+taka(np),state.user.roleLabel);break;
        case"collection":
          var c=d.customers.find(function(x){return x.id===g("f_cust")});var am=gn("f_amt");if(!c||am<=0)return alert("Invalid customer or amount");
          d.collections.push({id:nextId(d.collections,"COL"),date:todayISO(),customerId:c.id,amount:am,method:g("f_method"),collectedBy:state.user.name});
          log(d,state.user.name,"Collected "+taka(am)+" from "+c.shop,state.user.roleLabel);break;
        case"claim":
          var p2=d.products.find(function(x){return x.sku===g("f_sku")});var fq=gn("f_free"),dc2=gn("f_disc");var val=fq*(p2?p2.cost:0)+dc2;if(val<=0)return alert("Claim value must be > 0");
          d.claims.push({id:nextId(d.claims,"CLM"),date:todayISO(),supplierId:g("f_sup"),sku:g("f_sku"),freeQty:fq,discount:dc2,value:val,status:"Pending"});
          log(d,state.user.name,"Claim submitted: "+taka(val),state.user.roleLabel);break;
        case"assets":
          d.assets.securityDeposit=gn("f_sec");d.assets.transportAssets=gn("f_tr");d.assets.officeAdvance=gn("f_off");d.assets.godownAdvance=gn("f_gd");d.assets.pendingBills=gn("f_pb");
          log(d,state.user.name,"Updated asset values",state.user.roleLabel);break;
      }
      saveData(d);state.modal=null;state.modalData={};render();
    }catch(e){alert("Error: "+e.message);}
  };

  /* ========== BACKUP EXPORT ========== */
  window.__exportBackup=function(){
    var dataStr=JSON.stringify(state.data,null,2);
    var blob=new Blob([dataStr],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="SamiraDMS-Backup-"+todayISO()+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log(state.data,state.user.name,"Exported backup file",state.user.roleLabel);
  };

  /* ========== INIT ========== */
  render();
})();
</script>
</html>
